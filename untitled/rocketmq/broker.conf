# RocketMQ Broker 配置（本地开发用）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 容器内通过服务名访问 NameServer
namesrvAddr = rocketmq-namesrv:9876

# 关键：注册给客户端的地址。客户端在宿主机上，所以必须是 127.0.0.1
brokerIP1 = 127.0.0.1

# 关键：允许自动创建 Topic / 订阅组，否则发 TopicTest 会报 topic not exist
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 本地开发放宽一些限制
defaultTopicQueueNums = 4
waitTimeMillsInSendQueue = 1000
